[project]
name = "consent-gate"
version = "0.1.0"
description = "An agent that goes from a plain prompt to a signed contract - and is structurally incapable of signing it itself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
consent-gate = "consent_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consent_gate"]
